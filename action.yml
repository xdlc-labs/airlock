name: Airlock AI release gate
description: Gate AI artifact changes on a pull request.
author: xdlc-labs
branding:
  icon: shield
  color: blue

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "╭─ airlock ──────────────────────────────────────────╮"
        echo "│  pull request gate                                 │"
        echo "╰────────────────────────────────────────────────────╯"
        echo "  1/5  resolve CLI"
        echo "::group::1/5 Resolve CLI"
        dest=/tmp/airlock
        ref="${ACTION_REF:-}"
        ref="${ref#refs/tags/}"
        need_go=true
        # A major-only ref such as v0 is a moving tag, not the name of a
        # release, so releases/download/v0/... does not exist. Resolve it to
        # the release it currently points at, or every run pays for a Go build.
        if [[ "$ref" =~ ^v[0-9]+$ ]]; then
          api="https://api.github.com/repos/xdlc-labs/airlock/releases?per_page=50"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            body=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api" || true)
          else
            body=$(curl -fsSL -H "Accept: application/vnd.github+json" "$api" || true)
          fi
          resolved=$(printf '%s' "$body" | jq -r --arg m "${ref}." '[.[] | select(.draft == false) | .tag_name | select(startswith($m))][0] // empty' 2>/dev/null || true)
          if [ -n "$resolved" ]; then
            echo "  ok   $ref -> $resolved"
            ref="$resolved"
          else
            echo "  warn no release matches $ref, will build"
          fi
        fi
        if [[ "$ref" == v[0-9]* ]]; then
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) arch="" ;;
          esac
          if [ -n "$arch" ] && { [ "$os" = linux ] || [ "$os" = darwin ]; }; then
            url="https://github.com/xdlc-labs/airlock/releases/download/${ref}/airlock_${ref#v}_${os}_${arch}.tar.gz"
            tmp=$(mktemp -d)
            if curl -fsSL "$url" -o "$tmp/airlock.tgz" && tar -xzf "$tmp/airlock.tgz" -C "$tmp" && [ -f "$tmp/airlock" ]; then
              install -m 755 "$tmp/airlock" "$dest"
              need_go=false
              echo "  ok   release $ref"
            else
              echo "  skip release download, will build"
            fi
            rm -rf "$tmp"
          fi
        fi
        if [ "$need_go" = true ]; then
          echo "  ok   build from source"
        fi
        echo "need_go=${need_go}" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - uses: actions/setup-go@v5
      if: steps.resolve.outputs.need_go == 'true'
      with:
        go-version: "1.25.x"
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - if: steps.resolve.outputs.need_go == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        echo "  1/5  build CLI"
        echo "::group::1/5 Build"
        go build -o /tmp/airlock ./cmd/airlock
        echo "  ok   $(/tmp/airlock version)"
        echo "::endgroup::"

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        echo "  2/5  fetch refs"
        echo "::group::2/5 Fetch refs"
        git fetch -q origin "${GITHUB_BASE_REF:-HEAD}" 2>/dev/null || true
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          HEAD=${GITHUB_SHA}
        else
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD")
        fi
        echo "  base  ${BASE:0:12}"
        echo "  head  ${HEAD:0:12}"
        echo "::endgroup::"

        w=$(mktemp -d)
        cleanup() {
          git worktree remove --force "$w/base" >/dev/null 2>&1 || true
          git worktree remove --force "$w/head" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        echo "  3/5  snapshot merge-base"
        echo "::group::3/5 Snapshot merge-base"
        git worktree add -q --detach "$w/base" "$BASE"
        (cd "$w/base" && /tmp/airlock init && /tmp/airlock snapshot)
        id=$(basename "$(ls -t "$w/base/.airlock/snapshots/"*.json | head -1)" .json)
        echo "  ok   $id"
        echo "::endgroup::"

        echo "  4/5  snapshot head"
        echo "::group::4/5 Snapshot head"
        git worktree add -q --detach "$w/head" "$HEAD"
        mkdir -p "$w/head/.airlock/snapshots"
        cp -a "$w/base/.airlock/snapshots/." "$w/head/.airlock/snapshots/"
        (cd "$w/head" && /tmp/airlock init && /tmp/airlock snapshot)
        echo "  ok   head"
        echo "::endgroup::"

        echo "  5/5  gate"
        echo "::group::5/5 Gate"
        set +e
        (cd "$w/head" && /tmp/airlock ci --base "$id" --head working --fail-on-approval)
        status=$?
        set -e
        echo "::endgroup::"

        if [ -f "$w/head/.airlock/ci-comment.md" ]; then
          cp "$w/head/.airlock/ci-comment.md" /tmp/airlock-comment.md
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f /tmp/airlock-comment.md ]; then
          cat /tmp/airlock-comment.md >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "${PR_NUMBER:-}" ] && [ -f /tmp/airlock-comment.md ]; then
          echo "::group::PR comment"
          cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq '.[] | select(.body | contains("<!-- airlock-gate -->")) | .id' \
            | head -1 || true)
          if [ -n "$cid" ]; then
            python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1], encoding="utf-8").read()}))' /tmp/airlock-comment.md \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" --input -
            echo "  ok   updated comment $cid"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/airlock-comment.md
            echo "  ok   posted comment"
          fi
          echo "::endgroup::"
        fi

        exit "$status"
