name: Airlock
description: Gate AI artifact changes on a pull request.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.x"
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o /tmp/airlock ./cmd/airlock

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        git fetch origin "${GITHUB_BASE_REF:-HEAD}" 2>/dev/null || true
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          HEAD=${GITHUB_SHA}
        else
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD")
        fi
        w=$(mktemp -d)
        git worktree add --detach "$w/base" "$BASE"
        git worktree add --detach "$w/head" "$HEAD"
        (cd "$w/base" && /tmp/airlock init && /tmp/airlock snapshot)
        id=$(basename "$(ls -t "$w/base/.airlock/snapshots/"*.json | head -1)" .json)
        mkdir -p "$w/head/.airlock/snapshots"
        cp -a "$w/base/.airlock/snapshots/." "$w/head/.airlock/snapshots/"
        (cd "$w/head" && /tmp/airlock init && /tmp/airlock snapshot)
        set +e
        (cd "$w/head" && /tmp/airlock ci --base "$id" --head working --comment --fail-on-approval) | tee /tmp/airlock-comment.md
        status=${PIPESTATUS[0]}
        set -e
        git worktree remove --force "$w/base" || true
        git worktree remove --force "$w/head" || true
        if [ -n "${PR_NUMBER:-}" ] && [ -f /tmp/airlock-comment.md ]; then
          gh pr comment "$PR_NUMBER" --edit-last --body-file /tmp/airlock-comment.md \
            || gh pr comment "$PR_NUMBER" --body-file /tmp/airlock-comment.md
        fi
        exit "$status"
