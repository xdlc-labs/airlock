name: Airlock

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A review is what unblocks a NEEDS_APPROVAL, so re-run when one lands.
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  airlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
