name: Release

on:
  push:
    # Two dots minimum, so a full version such as v0.1.0-beta.13 matches and the
    # moving major tag v0 does not. `v*` matched v0 too, so every time v0 was
    # repointed this workflow published a release literally named "Airlock 0",
    # carrying version-less airlock_0_<os>_<arch> assets, which GitHub then
    # served as the repository's latest release.
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag must look like v1.2.3 or v1.2.3-beta.1, got: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *beta*|*rc*|*alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          out="airlock_${VER}_${GOOS}_${GOARCH}"
          mkdir -p dist
          if [ "$GOOS" = windows ]; then
            go build -trimpath -ldflags="-s -w -X main.version=${VER}" -o "dist/airlock.exe" ./cmd/airlock
            (cd dist && zip -q "${out}.zip" airlock.exe && rm -f airlock.exe && sha256sum "${out}.zip" > "${out}.zip.sha256")
          else
            go build -trimpath -ldflags="-s -w -X main.version=${VER}" -o "dist/airlock" ./cmd/airlock
            tar -C dist -czf "dist/${out}.tar.gz" airlock
            rm -f dist/airlock
            (cd dist && sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: airlock-${{ steps.ver.outputs.ver }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *beta*|*rc*|*alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: airlock-${{ steps.ver.outputs.ver }}-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Airlock ${{ steps.ver.outputs.ver }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
